      .prompt-sym  { fill: #2ecc71; }
      .cmd         { fill: #e0ffe0; }
      .out-key     { fill: #4ec94e; }
      .out-val     { fill: #b8ffb8; }
      .out-dim     { fill: #4a7a4a; }
